<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de invitados | Eunice & David</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-stone-50 text-stone-800 min-h-screen"><main class="max-w-6xl mx-auto p-5 md:p-8"><header class="flex items-center justify-between gap-4 mb-6"><div><div class="text-xs uppercase tracking-widest text-stone-500">Eunice & David</div><h1 class="text-3xl md:text-4xl mt-1">Gestión de invitados</h1></div><button id="logout" class="hidden text-sm underline">Cerrar sesión</button></header><section id="login" class="max-w-sm mx-auto bg-white rounded-2xl shadow-sm p-6"><h2 class="text-xl mb-4">Acceso privado</h2><input id="password" type="password" placeholder="Contraseña" class="w-full border rounded-xl p-3"><button id="loginBtn" class="w-full mt-3 rounded-xl bg-stone-700 text-white p-3">Entrar</button><div id="loginError" class="text-red-700 text-sm mt-3"></div></section><section id="app" class="hidden"><div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"><div class="bg-white rounded-2xl p-4"><div class="text-xs text-stone-500">Invitados</div><div id="sTotal" class="text-2xl">0</div></div><div class="bg-white rounded-2xl p-4"><div class="text-xs text-stone-500">Confirmados</div><div id="sOk" class="text-2xl">0</div></div><div class="bg-white rounded-2xl p-4"><div class="text-xs text-stone-500">Pendientes</div><div id="sPending" class="text-2xl">0</div></div><div class="bg-white rounded-2xl p-4"><div class="text-xs text-stone-500">No asisten</div><div id="sNo" class="text-2xl">0</div></div><div class="bg-white rounded-2xl p-4"><div class="text-xs text-stone-500">Personas</div><div id="sPeople" class="text-2xl">0</div></div></div><div class="bg-white rounded-2xl shadow-sm p-5 mb-6"><h2 class="text-xl mb-4">Agregar invitado</h2><div class="grid md:grid-cols-4 gap-3"><input id="newName" placeholder="Nombre / familia" class="border rounded-xl p-3"><input id="newPhone" placeholder="WhatsApp: 549..." class="border rounded-xl p-3"><input id="newSeats" type="number" min="1" value="1" class="border rounded-xl p-3"><button id="addBtn" class="rounded-xl bg-stone-700 text-white p-3">Agregar y generar enlace</button></div><div id="addMsg" class="text-sm mt-3"></div></div><div class="flex flex-col md:flex-row gap-3 mb-4"><input id="search" placeholder="Buscar invitado..." class="border rounded-xl p-3 bg-white flex-1"><select id="filter" class="border rounded-xl p-3 bg-white"><option value="todos">Todos</option><option value="pendiente">Pendientes</option><option value="confirmado">Confirmados</option><option value="no_asiste">No asisten</option></select></div><div class="bg-white rounded-2xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-stone-100"><tr><th class="text-left p-3">Invitado</th><th class="p-3">Lugares</th><th class="p-3">Estado</th><th class="p-3">Confirmados</th><th class="p-3">Código</th><th class="p-3">Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let invitados=[];const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function wa(g){const u=location.origin+'/?i='+g.codigo,m=`Hola ${g.nombre}, somos Eunice y David ❤️\nTe compartimos nuestra invitación: ${u}`;return 'https://wa.me/'+g.telefono.replace(/\D/g,'')+'?text='+encodeURIComponent(m)}function st(s){return s==='confirmado'?'🟢 Confirmó':s==='no_asiste'?'🔴 No asiste':'🟡 Pendiente'}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,list=invitados.filter(g=>(f==='todos'||g.estado===f)&&g.nombre.toLowerCase().includes(q));$('rows').innerHTML=list.map(g=>`<tr class="border-t"><td class="p-3"><div class="font-medium">${esc(g.nombre)}</div><div class="text-xs text-stone-500">${esc(g.telefono||'Sin WhatsApp')}</div></td><td class="p-3 text-center">${g.lugares}</td><td class="p-3 text-center">${st(g.estado)}</td><td class="p-3 text-center">${g.confirmados||0}</td><td class="p-3 text-center font-mono">${g.codigo}</td><td class="p-3"><div class="flex flex-wrap gap-2 justify-center"><a class="px-3 py-2 rounded-lg bg-green-600 text-white" target="_blank" href="${wa(g)}">WhatsApp</a><button class="px-3 py-2 rounded-lg bg-stone-200" onclick="copyLink('${g.codigo}')">Copiar enlace</button><button class="px-3 py-2 rounded-lg text-red-700" onclick="delGuest(${g.id})">Eliminar</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center text-stone-500">No hay invitados para mostrar.</td></tr>';$('sTotal').textContent=invitados.length;$('sOk').textContent=invitados.filter(g=>g.estado==='confirmado').length;$('sPending').textContent=invitados.filter(g=>g.estado==='pendiente').length;$('sNo').textContent=invitados.filter(g=>g.estado==='no_asiste').length;$('sPeople').textContent=invitados.reduce((a,g)=>a+(g.confirmados||0),0)}async function load(){const r=await fetch('/.netlify/functions/admin-guests');if(r.status===401){showLogin();return}const d=await r.json();invitados=d.invitados||[];render()}function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');load()}$('loginBtn').onclick=async()=>{const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(r.ok)showApp();else $('loginError').textContent=(await r.json()).error||'No se pudo ingresar.'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logout').onclick=async()=>{await fetch('/.netlify/functions/admin-logout',{method:'POST'});showLogin()};$('addBtn').onclick=async()=>{const r=await fetch('/.netlify/functions/admin-guests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:$('newName').value,telefono:$('newPhone').value,lugares:Number($('newSeats').value)})});const d=await r.json();if(!r.ok){$('addMsg').textContent=d.error||'Error';return}invitados.push(d);$('newName').value='';$('newPhone').value='';$('newSeats').value=1;$('addMsg').textContent='Invitado agregado. Código: '+d.codigo;render()};$('search').oninput=render;$('filter').onchange=render;window.copyLink=async c=>{await navigator.clipboard.writeText(location.origin+'/?i='+c);alert('Enlace copiado.')};window.delGuest=async id=>{if(!confirm('¿Eliminar este invitado?'))return;const r=await fetch('/.netlify/functions/admin-guests',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});if(r.ok){invitados=invitados.filter(g=>g.id!==id);render()}};load();</script></body></html>
