<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Panel de Invitados | Eunice & David
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-stone-100">

<div class="max-w-7xl mx-auto p-6">

    <div class="mb-8">

        <div>
            <a
                href="admin_mult.html"
                class="mb-4 inline-flex items-center gap-2 rounded-lg bg-stone-800 px-4 py-3 text-sm font-medium text-white transition hover:bg-stone-700"
            >
                <span aria-hidden="true">▣</span>
                Administrar multimedia
            </a>

            <a
                href="admin_dedicatorias.html"
                class="mb-4 ml-2 inline-flex items-center gap-2 rounded-lg bg-amber-700 px-4 py-3 text-sm font-medium text-white transition hover:bg-amber-800"
            >
                <span aria-hidden="true">✎</span>
                Administrar dedicatorias
            </a>

            <h1 class="text-4xl font-light">
                Administración
            </h1>
        </div>

        <p class="text-stone-500 mt-2">
            Invitación Digital Eunice & David
        </p>

    </div>

    <!-- DASHBOARD -->

    <div class="bg-white rounded-xl shadow-sm overflow-x-auto mb-8">
        <table class="min-w-full text-center">
            <thead class="bg-stone-200">
                <tr>
                    <th class="p-3 text-left">Resumen</th>
                    <th class="p-3">Civil</th>
                    <th class="p-3">Conferencia</th>
                    <th class="p-3">Fiesta</th>
                    <th class="p-3">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-t">
                    <th class="p-3 text-left">Invitados</th>
                    <td id="sInvitadosCivil" class="p-3">0</td>
                    <td id="sInvitadosConferencia" class="p-3">0</td>
                    <td id="sInvitadosFiesta" class="p-3">0</td>
                    <td id="sInvitadosTotal" class="p-3 font-semibold">0</td>
                </tr>
                <tr class="border-t">
                    <th class="p-3 text-left">Confirmados</th>
                    <td id="sConfirmadosCivil" class="p-3">0</td>
                    <td id="sConfirmadosConferencia" class="p-3">0</td>
                    <td id="sConfirmadosFiesta" class="p-3">0</td>
                    <td id="sConfirmadosTotal" class="p-3 font-semibold">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- NUEVO INVITADO -->

    <div class="bg-white rounded-xl p-6 shadow-sm mb-8">

        <h2 class="text-2xl mb-4">
            Nuevo Invitado
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <input
                id="newName"
                type="text"
                placeholder="Nombre"
                class="border rounded-lg p-3">

            <input
                id="newPhone"
                type="text"
                placeholder="WhatsApp"
                class="border rounded-lg p-3">

            <input
                id="newSeats"
                type="number"
                value="1"
                min="1"
                class="border rounded-lg p-3">

            <input
                id="newObs"
                type="text"
                placeholder="Observaciones"
                class="border rounded-lg p-3">

            <label class="flex items-center gap-2">

                <input
                    id="newCeremony"
                    type="checkbox"
                    checked>

                Invitado a ceremonia

            </label>

            <label class="flex items-center gap-2">

                <input
                    id="newParty"
                    type="checkbox"
                    checked>

                Invitado a fiesta

            </label>

        </div>

        <button
            class="bg-stone-800 text-white px-5 py-3 rounded-lg mt-5"
            onclick="crearInvitado()">

            Crear Invitado

        </button>

    </div>


    <!-- BUSQUEDA -->

    <div class="bg-white rounded-xl p-4 shadow-sm mb-4">

        <input
            id="search"
            placeholder="Buscar invitado..."
            class="border rounded-lg p-3 w-full">

    </div>

    <!-- TABLA -->

    <div class="bg-white rounded-xl shadow-sm overflow-auto">

        <table class="min-w-full">

            <thead>

                <tr class="bg-stone-200">

                    <th class="p-3 text-left">
                        Nombre
                    </th>

                    <th class="p-3">
                        Teléfono
                    </th>

                    <th class="p-3">
                        Cupos
                    </th>

                    <th class="p-3">
                        Confirmados
                    </th>

                    <th class="p-3">
                        Ceremonia
                    </th>

                    <th class="p-3">
                        Fiesta
                    </th>

                    <th class="p-3 text-left">
                        Comentario
                    </th>

                    <th class="p-3">
                        Acciones
                    </th>

                </tr>

            </thead>

            <tbody id="rows">

            </tbody>

        </table>

    </div>

</div>

<script>
const API_URL =
    "https://script.google.com/macros/s/AKfycby80WR98QzVdQk9SrVOuZ_AiA42rKROIT-ZjkMXLfEt4usPjbZ585kD5DcS_Zns2M8Y/exec";

const SITE_URL =
    "https://invitaciondigital2026-stack.github.io/Euni/";

let invitados = [];

function apiUrl(action, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.set("action", action);

    Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
            url.searchParams.set(key, String(value));
        }
    });

    return url.toString();
}

async function apiGet(action, params = {}) {
    const response = await fetch(apiUrl(action, params), {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    return await response.json();
}

function esc(valor) {
    return String(valor ?? "").replace(/[&<>\'"]/g, caracter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
    }[caracter]));
}

function mostrarError(error, mensaje = "No se pudo completar la operación.") {
    console.error(error);
    alert(`${mensaje}\n\n${error?.message || error || ""}`);
}

/* ===========================
   DASHBOARD
=========================== */

async function cargarResumen() {
    const resumen = {
        invitadosCivil: 0,
        invitadosConferencia: 0,
        invitadosFiesta: 0,
        invitadosTotal: 0,
        confirmadosCivil: 0,
        confirmadosConferencia: 0,
        confirmadosFiesta: 0,
        confirmadosTotal: 0
    };

    invitados.forEach(invitado => {
        const permitidos = Number(invitado.cantidadPermitida) || 0;
        const confirmados = Number(invitado.cantidadConfirmada) || 0;
        const tieneCeremonia = estaHabilitado(invitado.invitadoCeremonia);

        resumen.invitadosTotal += permitidos;
        if (tieneCeremonia) {
            resumen.invitadosCivil += permitidos;
            resumen.invitadosConferencia += permitidos;
        }
        if (estaHabilitado(invitado.invitadoFiesta)) {
            resumen.invitadosFiesta += permitidos;
        }

        resumen.confirmadosTotal += confirmados;
        if (estaHabilitado(invitado.confirmoCivil)) {
            resumen.confirmadosCivil += confirmados;
        }
        if (estaHabilitado(invitado.confirmoCeremonia)) {
            resumen.confirmadosConferencia += confirmados;
        }
        if (estaHabilitado(invitado.confirmoFiesta)) {
            resumen.confirmadosFiesta += confirmados;
        }
    });

    Object.entries(resumen).forEach(([campo, valor]) => {
        const elemento = document.getElementById(`s${campo.charAt(0).toUpperCase()}${campo.slice(1)}`);
        if (elemento) elemento.textContent = valor;
    });
}

/* ===========================
   LISTADO
=========================== */

async function cargarInvitados() {
    try {
        const data = await apiGet("list");
        invitados = Array.isArray(data.invitados) ? data.invitados : [];
        cargarResumen();
        render();
    } catch (error) {
        mostrarError(error, "No se pudo cargar la lista de invitados.");
    }
}

/* ===========================
   RENDER
=========================== */

function crearCelda(texto, clases = "") {
    const td = document.createElement("td");
    td.className = `p-3 ${clases}`;
    td.textContent = texto ?? "";
    return td;
}

function estaHabilitado(valor) {
    return valor === true || String(valor).toUpperCase() === "SI" || String(valor).toLowerCase() === "true";
}

function crearBoton(texto, clases, accion) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `${clases} px-3 py-1 rounded`;
    button.textContent = texto;
    button.addEventListener("click", accion);
    return button;
}

function getComentarioValue(invitado) {
    if (!invitado) return "";
    return invitado.comentario ?? invitado.observaciones ?? invitado.comentarioInvitado ?? invitado.observacion ?? "";
}

function getComentarioPayload(valor) {
    const texto = String(valor ?? "").trim();
    return {
        observaciones: texto,
        comentario: texto,
        observacion: texto
    };
}

function render() {
    const search = document.getElementById("search");
    const rows = document.getElementById("rows");

    if (!search || !rows) return;

    const texto = search.value.trim().toLowerCase();
    rows.replaceChildren();

    invitados
        .filter(i =>
            String(i.nombre || "").toLowerCase().includes(texto)
        )
        .forEach(i => {
            const tr = document.createElement("tr");
            tr.className = "border-t";
            tr.dataset.token = i.token;

            tr.appendChild(crearCelda(i.nombre || ""));
            tr.appendChild(crearCelda(i.telefono || "", "text-center"));
            tr.appendChild(crearCelda(i.cantidadPermitida ?? 0, "text-center"));
            tr.appendChild(crearCelda(i.cantidadConfirmada ?? 0, "text-center"));
            tr.appendChild(crearCelda(estaHabilitado(i.invitadoCeremonia) ? "✓ Sí" : "— No", "text-center"));
            tr.appendChild(crearCelda(estaHabilitado(i.invitadoFiesta) ? "✓ Sí" : "— No", "text-center"));
            tr.appendChild(crearCelda(getComentarioValue(i), "max-w-xs text-left"));

            const acciones = document.createElement("div");
            acciones.className = "flex flex-wrap gap-2";

            acciones.appendChild(
                crearBoton("Copiar Link", "bg-blue-600 text-white",
                    () => copiarLink(i.token))
            );

            acciones.appendChild(
                crearBoton("WhatsApp", "bg-green-600 text-white",
                    () => enviarWhatsapp(i.nombre || "", i.telefono || "", i.token))
            );

            acciones.appendChild(
                crearBoton("Editar", "bg-stone-700 text-white",
                    () => editarInvitado(i.token))
            );

            acciones.appendChild(
                crearBoton("Eliminar", "bg-red-600 text-white",
                    () => eliminarInvitado(i.token))
            );

            const tdAcciones = document.createElement("td");
            tdAcciones.className = "p-3";
            tdAcciones.appendChild(acciones);
            tr.appendChild(tdAcciones);

            rows.appendChild(tr);
        });
}

function editarInvitado(token) {
    const invitado = invitados.find(i => i.token === token);
    if (!invitado) return;

    const tr = [...document.getElementById("rows").children]
        .find(fila => fila.dataset.token === token);
    if (!tr) return;

    const comentarioActual = getComentarioValue(invitado);

    tr.innerHTML = `
        <td class="p-3"><input data-edit="nombre" value="${esc(invitado.nombre || "")}" class="border rounded p-2 w-full"></td>
        <td class="p-3"><input data-edit="telefono" value="${esc(invitado.telefono || "")}" class="border rounded p-2 w-full"></td>
        <td class="p-3"><input data-edit="cantidadPermitida" type="number" min="1" value="${Number(invitado.cantidadPermitida) || 1}" class="border rounded p-2 w-20"></td>
        <td class="p-3 text-center">${invitado.cantidadConfirmada ?? 0}</td>
        <td class="p-3 text-center"><input data-edit="invitadoCeremonia" type="checkbox" ${estaHabilitado(invitado.invitadoCeremonia) ? "checked" : ""} class="w-4 h-4"></td>
        <td class="p-3 text-center"><input data-edit="invitadoFiesta" type="checkbox" ${estaHabilitado(invitado.invitadoFiesta) ? "checked" : ""} class="w-4 h-4"></td>
        <td class="p-3"><input data-edit="observaciones" value="${esc(comentarioActual)}" class="border rounded p-2 w-full"></td>
        <td class="p-3"><div class="flex flex-wrap gap-2">
            <button class="bg-green-700 text-white px-3 py-1 rounded" onclick="guardarInvitado('${esc(token)}', this)">Guardar</button>
            <button class="bg-stone-200 px-3 py-1 rounded" onclick="render()">Cancelar</button>
        </div></td>`;
}

async function guardarInvitado(token, boton) {
    const fila = boton.closest("tr");
    const valor = nombre => fila.querySelector(`[data-edit="${nombre}"]`);
    const nombre = valor("nombre").value.trim();
    const cantidad = Math.max(1, parseInt(valor("cantidadPermitida").value, 10) || 1);

    if (!nombre) {
        alert("Ingresá el nombre del invitado.");
        return;
    }

    boton.disabled = true;
    const comentario = valor("observaciones").value.trim();
    try {
        const data = await apiGet("update", {
            token,
            nombre,
            telefono: valor("telefono").value.trim(),
            cantidadPermitida: cantidad,
            invitadoCeremonia: valor("invitadoCeremonia").checked ? "SI" : "NO",
            invitadoFiesta: valor("invitadoFiesta").checked ? "SI" : "NO",
            ...getComentarioPayload(comentario)
        });

        if (!data.success) {
            if (data.error === "Acción inválida") {
                throw new Error("El backend de Google Apps Script todavía no tiene habilitada la acción de actualización. Hay que agregar action=update en el Apps Script.");
            }
            throw new Error(data.error || "No se pudo actualizar el invitado.");
        }
        const indice = invitados.findIndex(i => i.token === token);
        const invitadoActualizado = data.invitado || data;
        invitadoActualizado.observaciones = getComentarioValue(invitadoActualizado);
        invitadoActualizado.comentario = getComentarioValue(invitadoActualizado);
        invitados[indice] = invitadoActualizado;
        render();
    } catch (error) {
        boton.disabled = false;
        mostrarError(error, "No se pudo actualizar el invitado.");
    }
}

/* ===========================
   CREAR
=========================== */

async function crearInvitado() {
    const nombre = document.getElementById("newName").value.trim();
    const telefono = document.getElementById("newPhone").value.trim();

    const cantidad = Math.max(
        1,
        parseInt(document.getElementById("newSeats").value, 10) || 1
    );

    const observaciones = document.getElementById("newObs").value.trim();

    const ceremonia =
        document.getElementById("newCeremony").checked ? "SI" : "NO";

    const fiesta =
        document.getElementById("newParty").checked ? "SI" : "NO";

    if (!nombre) {
        alert("Ingresá el nombre del invitado.");
        document.getElementById("newName").focus();
        return;
    }

    try {
        const data = await apiGet("create", {
            nombre,
            telefono,
            cantidadPermitida: cantidad,
            invitadoCeremonia: ceremonia,
            invitadoFiesta: fiesta,
            ...getComentarioPayload(observaciones)
        });

        if (!data.success) {
            throw new Error(data.error || "Error creando invitado.");
        }

        const link = generarLink(data.token);

        document.getElementById("newName").value = "";
        document.getElementById("newPhone").value = "";
        document.getElementById("newObs").value = "";
        document.getElementById("newSeats").value = 1;

        await cargarInvitados();
    } catch (error) {
        mostrarError(error, "No se pudo crear el invitado.");
    }
}

/* ===========================
   LINK
=========================== */

function generarLink(token) {
    const url = new URL(SITE_URL);
    url.searchParams.set("t", token);
    return url.toString();
}

async function copiarLink(token) {
    const link = generarLink(token);

    try {
        await navigator.clipboard.writeText(link);
        alert("Enlace copiado.");
    } catch (error) {
        try {
            const input = document.createElement("input");
            input.value = link;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            input.remove();
            alert("Enlace copiado.");
        } catch (fallbackError) {
            console.error(fallbackError);
            prompt("Copiá este enlace:", link);
        }
    }
}

/* ===========================
   WHATSAPP
=========================== */

function enviarWhatsapp(nombre, telefono, token) {
    const enlace = generarLink(token);

    const mensaje =
        `Hola ${nombre} \n\n` +
        `Te invitamos a compartir con nosotros este momento tan especial.\n` +
        `Nos alegra entregarte nuestra invitacion digital para que puedas confirmar tu asistencia.\n\n` +
        `> Confirma tu asistencia aqui \n` +
        `${enlace} \n\n` +
        `Con mucho cariño,\n` +
        `*Eunice & David*`;

    const numero = String(telefono || "").replace(/\D/g, "");

    if (!numero) {
        alert("Este invitado no tiene un número de WhatsApp válido.");
        return;
    }

    const url =
        `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank", "noopener,noreferrer");
}

/* ===========================
   ELIMINAR
=========================== */

async function eliminarInvitado(token) {
    if (!token) {
        alert("El invitado no tiene token.");
        return;
    }

    if (!confirm("¿Eliminar invitado?")) return;

    try {
        const data = await apiGet("delete", { token });

        if (!data.success) {
            throw new Error(data.error || "No se pudo eliminar.");
        }

        await cargarInvitados();
    } catch (error) {
        mostrarError(error, "No se pudo eliminar el invitado.");
    }
}

/* ===========================
   EVENTOS
=========================== */

document.addEventListener("DOMContentLoaded", () => {
    const search = document.getElementById("search");

    if (search) {
        search.addEventListener("input", render);
    }

    cargarInvitados();
});
</script>

</body>
</html>
