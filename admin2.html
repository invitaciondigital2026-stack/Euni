<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Panel de Invitados | Eunice & David
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-stone-100">

<div class="max-w-7xl mx-auto p-6">

    <div class="mb-8">

        <h1 class="text-4xl font-light">
            Administración
        </h1>

        <p class="text-stone-500 mt-2">
            Invitación Digital Eunice & David
        </p>

    </div>

    <!-- DASHBOARD -->

    <div class="grid md:grid-cols-6 gap-4 mb-8">

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Invitados
            </div>
            <div id="sTotal"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Confirmados
            </div>
            <div id="sOk"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Pendientes
            </div>
            <div id="sPending"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Ceremonia
            </div>
            <div id="sConference"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Fiesta
            </div>
            <div id="sParty"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="text-sm text-stone-500">
                Lugares Confirmados
            </div>
            <div id="sSeats"
                 class="text-3xl mt-1">
                0
            </div>
        </div>

    </div>

    <!-- NUEVO INVITADO -->

    <div class="bg-white rounded-xl p-6 shadow-sm mb-8">

        <h2 class="text-2xl mb-4">
            Nuevo Invitado
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <input
                id="newName"
                type="text"
                placeholder="Nombre"
                class="border rounded-lg p-3">

            <input
                id="newPhone"
                type="text"
                placeholder="WhatsApp"
                class="border rounded-lg p-3">

            <input
                id="newSeats"
                type="number"
                value="1"
                min="1"
                class="border rounded-lg p-3">

            <input
                id="newObs"
                type="text"
                placeholder="Observaciones"
                class="border rounded-lg p-3">

            <label class="flex items-center gap-2">

                <input
                    id="newCeremony"
                    type="checkbox"
                    checked>

                Invitado a ceremonia

            </label>

            <label class="flex items-center gap-2">

                <input
                    id="newParty"
                    type="checkbox"
                    checked>

                Invitado a fiesta

            </label>

        </div>

        <button
            class="bg-stone-800 text-white px-5 py-3 rounded-lg mt-5"
            onclick="crearInvitado()">

            Crear Invitado

        </button>

    </div>


    <!-- BUSQUEDA -->

    <div class="bg-white rounded-xl p-4 shadow-sm mb-4">

        <input
            id="search"
            placeholder="Buscar invitado..."
            class="border rounded-lg p-3 w-full">

    </div>

    <!-- TABLA -->

    <div class="bg-white rounded-xl shadow-sm overflow-auto">

        <table class="min-w-full">

            <thead>

                <tr class="bg-stone-200">

                    <th class="p-3 text-left">
                        Nombre
                    </th>

                    <th class="p-3">
                        Teléfono
                    </th>

                    <th class="p-3">
                        Cupos
                    </th>

                    <th class="p-3">
                        Confirmados
                    </th>

                    <th class="p-3">
                        Acciones
                    </th>

                </tr>

            </thead>

            <tbody id="rows">

            </tbody>

        </table>

    </div>

</div>

<script>
const API_URL =
    "https://script.google.com/macros/s/AKfycby80WR98QzVdQk9SrVOuZ_AiA42rKROIT-ZjkMXLfEt4usPjbZ585kD5DcS_Zns2M8Y/exec";

const SITE_URL =
    "https://invitaciondigital2026-stack.github.io/Euni/";

let invitados = [];

function apiUrl(action, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.set("action", action);

    Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
            url.searchParams.set(key, String(value));
        }
    });

    return url.toString();
}

async function apiGet(action, params = {}) {
    const response = await fetch(apiUrl(action, params), {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    return await response.json();
}

function mostrarError(error, mensaje = "No se pudo completar la operación.") {
    console.error(error);
    alert(`${mensaje}\n\n${error?.message || error || ""}`);
}

/* ===========================
   DASHBOARD
=========================== */

async function cargarResumen() {
    try {
        const data = await apiGet("summary");

        document.getElementById("sTotal").textContent = data.total ?? 0;
        document.getElementById("sOk").textContent = data.confirmados ?? 0;
        document.getElementById("sPending").textContent = data.pendientes ?? 0;
        document.getElementById("sConference").textContent = data.invitadosCeremonia ?? 0;
        document.getElementById("sParty").textContent = data.invitadosFiesta ?? 0;
        document.getElementById("sSeats").textContent = data.confirmadosCantidad ?? 0;
    } catch (error) {
        mostrarError(error, "No se pudo cargar el resumen.");
    }
}

/* ===========================
   LISTADO
=========================== */

async function cargarInvitados() {
    try {
        const data = await apiGet("list");
        invitados = Array.isArray(data.invitados) ? data.invitados : [];
        render();
    } catch (error) {
        mostrarError(error, "No se pudo cargar la lista de invitados.");
    }
}

/* ===========================
   RENDER
=========================== */

function crearCelda(texto, clases = "") {
    const td = document.createElement("td");
    td.className = `p-3 ${clases}`;
    td.textContent = texto ?? "";
    return td;
}

function crearBoton(texto, clases, accion) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `${clases} px-3 py-1 rounded`;
    button.textContent = texto;
    button.addEventListener("click", accion);
    return button;
}

function render() {
    const search = document.getElementById("search");
    const rows = document.getElementById("rows");

    if (!search || !rows) return;

    const texto = search.value.trim().toLowerCase();
    rows.replaceChildren();

    invitados
        .filter(i =>
            String(i.nombre || "").toLowerCase().includes(texto)
        )
        .forEach(i => {
            const tr = document.createElement("tr");
            tr.className = "border-t";

            tr.appendChild(crearCelda(i.nombre || ""));
            tr.appendChild(crearCelda(i.telefono || "", "text-center"));
            tr.appendChild(crearCelda(i.cantidadPermitida ?? 0, "text-center"));
            tr.appendChild(crearCelda(i.cantidadConfirmada ?? 0, "text-center"));

            const acciones = document.createElement("div");
            acciones.className = "flex flex-wrap gap-2";

            acciones.appendChild(
                crearBoton("Copiar Link", "bg-blue-600 text-white",
                    () => copiarLink(i.token))
            );

            acciones.appendChild(
                crearBoton("WhatsApp", "bg-green-600 text-white",
                    () => enviarWhatsapp(i.nombre || "", i.telefono || "", i.token))
            );

            acciones.appendChild(
                crearBoton("Eliminar", "bg-red-600 text-white",
                    () => eliminarInvitado(i.token))
            );

            const tdAcciones = document.createElement("td");
            tdAcciones.className = "p-3";
            tdAcciones.appendChild(acciones);
            tr.appendChild(tdAcciones);

            rows.appendChild(tr);
        });
}

/* ===========================
   CREAR
=========================== */

async function crearInvitado() {
    const nombre = document.getElementById("newName").value.trim();
    const telefono = document.getElementById("newPhone").value.trim();

    const cantidad = Math.max(
        1,
        parseInt(document.getElementById("newSeats").value, 10) || 1
    );

    const observaciones = document.getElementById("newObs").value.trim();

    const ceremonia =
        document.getElementById("newCeremony").checked ? "SI" : "NO";

    const fiesta =
        document.getElementById("newParty").checked ? "SI" : "NO";

    if (!nombre) {
        alert("Ingresá el nombre del invitado.");
        document.getElementById("newName").focus();
        return;
    }

    try {
        const data = await apiGet("create", {
            nombre,
            telefono,
            cantidadPermitida: cantidad,
            invitadoCeremonia: ceremonia,
            invitadoFiesta: fiesta,
            observaciones
        });

        if (!data.success) {
            throw new Error(data.error || "Error creando invitado.");
        }

        const link = generarLink(data.token);

        document.getElementById("newName").value = "";
        document.getElementById("newPhone").value = "";
        document.getElementById("newObs").value = "";
        document.getElementById("newSeats").value = 1;

        await Promise.all([cargarInvitados(), cargarResumen()]);
    } catch (error) {
        mostrarError(error, "No se pudo crear el invitado.");
    }
}

/* ===========================
   LINK
=========================== */

function generarLink(token) {
    const url = new URL(SITE_URL);
    url.searchParams.set("t", token);
    return url.toString();
}

async function copiarLink(token) {
    const link = generarLink(token);

    try {
        await navigator.clipboard.writeText(link);
        alert("Enlace copiado.");
    } catch (error) {
        try {
            const input = document.createElement("input");
            input.value = link;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            input.remove();
            alert("Enlace copiado.");
        } catch (fallbackError) {
            console.error(fallbackError);
            prompt("Copiá este enlace:", link);
        }
    }
}

/* ===========================
   WHATSAPP
=========================== */

function enviarWhatsapp(nombre, telefono, token) {
    const enlace = generarLink(token);

    const mensaje =
        `Hola ${nombre} ❤️\n\n` +
        `Queremos compartir con vos nuestra invitación.\n\n` +
        `${enlace}`;

    const numero = String(telefono || "").replace(/\D/g, "");

    if (!numero) {
        alert("Este invitado no tiene un número de WhatsApp válido.");
        return;
    }

    const url =
        `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank", "noopener,noreferrer");
}

/* ===========================
   ELIMINAR
=========================== */

async function eliminarInvitado(token) {
    if (!token) {
        alert("El invitado no tiene token.");
        return;
    }

    if (!confirm("¿Eliminar invitado?")) return;

    try {
        const data = await apiGet("delete", { token });

        if (!data.success) {
            throw new Error(data.error || "No se pudo eliminar.");
        }

        await Promise.all([cargarInvitados(), cargarResumen()]);
    } catch (error) {
        mostrarError(error, "No se pudo eliminar el invitado.");
    }
}

/* ===========================
   EVENTOS
=========================== */

document.addEventListener("DOMContentLoaded", () => {
    const search = document.getElementById("search");

    if (search) {
        search.addEventListener("input", render);
    }

    cargarResumen();
    cargarInvitados();
});
</script>

</body>
</html>
